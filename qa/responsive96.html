</style></head><body><header><h1>Sable Reach · Mobile layout check</h1><p>Real game in a narrow browser viewport. This checks responsive layout, not Safari or physical iPhone hardware.</p><label for="size96">Viewport<select id="size96"><option value="390,844">390 × 844 · portrait</option><option value="375,667">375 × 667 · compact portrait</option><option value="430,932">430 × 932 · large portrait</option><option value="844,390">844 × 390 · landscape</option><option value="1280,720">1280 × 720 · laptop</option></select></label><label for="standalone96"><input id="standalone96" type="checkbox" checked>Standalone safe-area fallback</label></header><main><iframe id="game96" title="Responsive game preview" src="../index.html?v=96&amp;layoutQA=standalone"></iframe></main><script>
const frame=document.getElementById('game96'),size=document.getElementById('size96'),mode=document.getElementById('standalone96');
size.onchange=()=>{const [w,h]=size.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px'};

</script></body></html>
